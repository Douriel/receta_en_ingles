<div class="modal-header">
    <h4 class="modal-title">{{modalTitle()}}</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss('Cross click')"></button>
</div>
<form>
    <div class="modal-body">
        <div class="input-group">
            <label class="input-group-text" for="shListName">Name</label>
            <input class="form-control" id="shListName" type="text" [formField]="shListForm.name">
        </div>
        <div>
            <label for="shListDescription">Description</label>
            <input id="shListDescription" type="text" [formField]="shListForm.notes">
        </div>
    </div>
    <div class="modal-body">
        <label for="shList">List of ingredients:</label>
        @for (ingredient of shListForm.ingredients; track ingredient) {
            <div class="name-delete">
                <label for="ingName">Name</label>
                <input id="ingName"  type="text" [formField]="ingredient.ingredient.name" [ngbTypeahead]="search">
                <button type="button" class="btn btn-outline-danger ms-2 w-25" (click)="deleteRowIng($index)"><i class="bi bi-dash"></i>
                </button>
            </div>
            <div class="input-group">
                <label class="input-group-text" for="ingUnit">Units</label>
                <ng-select class="form-control" id="ingUnit"  type="text" [formField]="ingredient.unit" [items]="unitNames()"/>
            </div>
            <div>
                <label for="ingQuan">Quantity</label>
                <input id="ingQuan"  type="number" [formField]="ingredient.quantity">
            </div>
        }
        <button type="button" class="btn btn-outline-primary" (click)="addIng()">
            <i class="bi bi-plus-lg"></i>
        </button>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="debugging()">Debugging</button>
        @if(editFlag){
            <button type="button" class="btn btn-danger" (click)="deleteShList()">Delete</button>
        }
        <button type="button" class="btn btn-primary" (click)="submitForm()" [disabled]="!shListForm().valid()">Save</button>
    </div>
</form>
