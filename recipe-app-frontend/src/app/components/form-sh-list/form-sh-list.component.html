<div class="modal-header">
    <h4 class="modal-title">{{modalTitle()}}</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss('Cross click')"></button>
</div>
<form>
    <div class="modal-body">
        <div>
            <label for="shListName">Name</label>
            <input id="shListName" type="text" [formField]="shListForm.name">
        </div>
        <div>
            <label for="shListDescription">Description</label>
            <input id="shListDescription" type="text" [formField]="shListForm.notes">
        </div>
    </div>
    <div>
        <label for="shList">List of ingredients:</label>
        <button type="button" class="btn btn-outline-secondary" (click)="addIng()">
            <i class="bi bi-plus-lg"></i>
        </button>
    </div>
    @for (ingredient of shListForm.ingredients; track ingredient) {
        <div>
            <label for="ingName">Ingredient Name</label>
            <input id="ingName"  type="text" [formField]="ingredient.ingredient.name">
            <button type="button" class="btn btn-outline-secondary" (click)="deleteRowIng($index)"><i class="bi bi-dash"></i>
            </button>
        </div>
        <div>
            <label for="ingUnit">Units</label>
            <input id="ingUnit"  type="text" [formField]="ingredient.ingredient.unit">
        </div>
        <div>
            <label for="ingQuan">Quantity</label>
            <input id="ingQuan"  type="number" [formField]="ingredient.ingredient.quantity">
        </div>
    }
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="debugging()">Debugging</button>
        @if(editFlag){
            <button type="button" class="btn btn-outline-danger" (click)="deleteShList()">Delete</button>
        }
        <button type="button" class="btn btn-outline-primary" (click)="submitForm()" [disabled]="!shListForm().valid()">Save</button>
    </div>
</form>
