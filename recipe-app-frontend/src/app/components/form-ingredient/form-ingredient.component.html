<div class="modal-header">
    <h4 class="modal-title">{{modalTitle()}}</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss('Cross click')"></button>
</div>
<form>
    <div class="modal-body">
        <div class="input-group">
            <label class="input-group-text" for="ingName">Name</label>
            <input class="form-control" id="ingName" type="text" [formField]="ingForm.name">
        </div>
        <div class="input-group">
            <label class="input-group-text" for="ingUnit">Units</label>
            <ng-select class="form-control" id="ingUnit"  type="text" [formField]="ingForm.unit" [items]="unitNames()"/>
        </div>
        <div class="input-group">
            <label class="input-group-text" for="ingQuantity">Quantity</label>
            <input class="form-control" id="ingQuantity" type="number" step="1" [formField]="ingForm.quantity">
        </div>
        <div class="notes-input">
            <label for="ingNotes">Notes</label>
            <textarea id="ingNotes" [formField]="ingForm.notes"></textarea>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="debugging()">Debugging</button>

        @if(editFlag){
            <button type="button" class="btn btn-outline-danger" (click)="deleteIng()">Delete</button>
        }

        <button type="button" class="btn btn-outline-primary" (click)="submitForm()" [disabled]="!ingForm().valid()">Save</button>
    </div>
</form>
