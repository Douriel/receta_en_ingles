<nav-bar/>
<div class="p-4">
	<div class="title-search">
		<h1>Tag editor</h1>
		<div class="input-group">
			<span class="input-group-text" id="basic-addon1"><i class="bi bi-search"></i></span> 
			<input type="text" class="form-control" placeholder="Search for tags" (input)="searchElement($event.target.value)">
		</div>
	</div>
	<table class="table table-striped">
		<thead>
			<tr>
				<th scope="col">Tags</th>
			</tr>
		</thead>
		<tbody>
			@for (tag of tagsAux(); track tag.name; let i = $index) {
				<tr>
					<!-- <th scope="row">{{ i + 1 }}</th> -->
					<td> {{ tag.name }} </td>
				</tr>
			}
		</tbody>
	</table>
	<button (click)="createTag()" type="button">Add a recipe</button>
</div>
